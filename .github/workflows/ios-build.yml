name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project NeonSnake.xcodeproj \
            -scheme NeonSnake \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ipa:
    name: Unsigned IPA (for sideloading)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NeonSnake.xcodeproj \
            -scheme NeonSnake \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NeonSnake.app Payload/
          zip -qry NeonSnake.ipa Payload
          ls -lh NeonSnake.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonSnake-ipa
          path: NeonSnake.ipa
          retention-days: 30
